# Passerelle locale vers youtube-fetcher — montée par docker-compose.override.yml, en dev
# uniquement. Elle existe pour qu'une AUTRE distribution WSL (démon Docker distinct, donc
# incapable de rejoindre le réseau typeflick_default) puisse appeler le scrapeur.
#
# Pourquoi une passerelle plutôt qu'un port publié directement sur youtube-fetcher : le service
# est volontairement sans port hôte fixe pour rester scalable (`--scale youtube-fetcher=N`).
# nginx résout le nom à chaque requête et répartit donc sur les N répliques, ce qu'un port
# hôte fixe interdirait.

server {
    listen 80;

    # DNS interne de Docker. Passer par une variable dans proxy_pass force la résolution au
    # moment de la requête : la passerelle démarre même si le fetcher est absent, et suit les
    # répliques qui apparaissent ou disparaissent.
    resolver 127.0.0.11 valid=10s;
    set $fetcher "youtube-fetcher";

    # Les lots d'identifiants (/youtube/videos/details, /youtube/channels/subs) sont volumineux.
    client_max_body_size 10m;

    location / {
        proxy_pass http://$fetcher:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /search/scrape-sync scrape en direct pendant l'appel : sans marge, nginx coupe en 504
        # avant que YouTube ait répondu.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
